# MCP server configurations (ADR-027 D3/D7).
#
# Pre-classify allowlist: only tools listed here are callable.
# Discovery != permission (HR#3): tools the server exposes but not listed
# here will raise UnknownToolError when called (fail-closed).
#
# reversibility follows the same 0-10 scale as tools.yaml (ADR-005 D2):
#   0  = irreversible (e.g., write_file, move_file)
#   10 = fully reversible (e.g., read_file, list_directory)
#
# api_key_env: credential indirection (HR#8). Set to null if no key needed.
# env: minimal subprocess env additions — do NOT put secrets inline (HR#10).
#
# MVP demo connector: @modelcontextprotocol/server-filesystem (ADR-027 D7).
# Demonstrates gate tier discrimination:
#   read_file/list_directory rev=10 → AUTO_EXECUTE (executed in demo)
#   write_file/move_file rev=1-2 → HARD_CONFIRM (gated, not auto-executed)

servers:
  filesystem:
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    api_key_env: null
    env: {}
    timeouts:
      connect: 15.0
      list_tools: 15.0
      call_tool: 30.0
    tools:
      read_file:
        reversibility: 10
      list_directory:
        reversibility: 10
      write_file:
        reversibility: 2
      move_file:
        reversibility: 1

  # Local knowledge-graph connector (@modelcontextprotocol/server-memory).
  # read_graph/search_nodes rev=10 → AUTO_EXECUTE; create_entities rev=1 → HARD_CONFIRM.
  # delete_entities (exposed by server) intentionally NOT listed → UnknownToolError (HR#3).
  memory:
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-memory"]
    api_key_env: null
    env: {}
    timeouts:
      connect: 15.0
      list_tools: 15.0
      call_tool: 30.0
    tools:
      read_graph:
        reversibility: 10
      search_nodes:
        reversibility: 10
      create_entities:
        reversibility: 1

  # Remote streamable-http demo connector (ADR-032 D4 / P3.7-remote-3).
  # One-demo discipline: read-tier query_items rev=10 → AUTO_EXECUTE.
  # Transport: streamable_http — TLS-verified https:// endpoint, api_key_env indirection.
  # CI e2e uses a hermetic mock (tests/mcp/test_p3_7_remote_connectors.py);
  # point url at a real MCP-compatible endpoint for manual demo.
  remote_demo:
    transport: streamable_http
    url: "https://api.example.com/mcp"
    api_key_env: REMOTE_DEMO_API_KEY
    timeouts:
      connect: 10.0
      list_tools: 10.0
      call_tool: 30.0
    tools:
      query_items:
        reversibility: 10

  # Local SQLite file connector.
  # read_query/list_tables rev=10 → AUTO_EXECUTE; write_query/create_table → HARD_CONFIRM.
  # drop_table (exposed by server) intentionally NOT listed → UnknownToolError (HR#3).
  sqlite:
    transport: stdio
    command: uvx
    args: ["mcp-server-sqlite", "--db-path", "/tmp/orchestrator.db"]
    api_key_env: null
    env: {}
    timeouts:
      connect: 15.0
      list_tools: 15.0
      call_tool: 30.0
    tools:
      read_query:
        reversibility: 10
      list_tables:
        reversibility: 10
      write_query:
        reversibility: 1
      create_table:
        reversibility: 2
