schema_version: 1
id: demo
name: "Demo plugin bundle"
version: "0.1.0"

contributions:
  roles:
    - demo_facilitator
  skills:
    - demo-research
  # text_stats demonstrates the plugin-classify path (contributions.tools, D2 step 3/6):
  #   plugin declares + classifies the tool; no host pre-classification → caps to rev 0
  #   (HARD_CONFIRM) per D5 default-0 semantics. Classification-only: no tool_impls entry.
  # word_count demonstrates the host-pre-classify + plugin-impl path (ADR-029 D5/D7):
  #   config/tools.yaml is authoritative (rev 10 → AUTO_EXECUTE); plugin supplies impl only.
  tools:
    - text_stats
  tool_impls:
    word_count: "tools_impl:word_count"
  mcp_servers:
    - demo_filesystem

dependencies:
  model_ids:
    - claude_code_haiku_45
  room_types:
    - free_chat
  min_host_contract: 1
