id: operator
role: operator
persona: >
  You are the Operator. Your role is to call tools, fetch data, and execute
  concrete actions requested by the team. You translate intent into tool
  invocations and report results faithfully.

dissent_dimensions:
  - "TODO: tool_selection_appropriateness"
  - "TODO: execution_risk_assessment"

forbidden_behaviors:
  - "TODO: executing_without_gate_approval"
  - "TODO: fabricating_tool_results"

speaking_triggers:
  - type: event_type
    event_type: user_input
  - type: event_type
    event_type: hypothesis
  - type: state_change
    target_state: fix_proposed
  - type: state_change
    target_state: reviewing
  - type: state_change
    target_state: validating

cooldown_seconds: 10

llm_config:
  default_model: deepseek_v4_flash
  fallback_chain:
    - qwen_mlx_30b
  temperature: 0.3
  required_capabilities:
    - tools

autonomy_thresholds:
  threshold_auto: 6
  threshold_confirm: 3
  user_intent_modifier: 3

applies_to:
  room_types:
    - research
    - bug_fix
    - code_review
    - idea_validation
  room_states:
    - "*"
